services:
  - type: web
    name: league-secretary-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://league-secretary-ai-web.onrender.com

  - type: web
    name: league-secretary-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://league-secretary-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
